<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Welcome, Sneha &amp; Akhil</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Georgia, serif;
			color: #fff;
			background: linear-gradient(135deg, #ff9a9e, #fad0c4 45%, #fbc2eb);
		}
		.card {
			width: min(90%, 620px);
			padding: 4rem 2rem;
			text-align: center;
			border: 1px solid rgba(255,255,255,.55);
			border-radius: 28px;
			background: rgba(255,255,255,.2);
			box-shadow: 0 20px 50px rgba(130, 55, 100, .2);
			backdrop-filter: blur(10px);
		}
		.heart { font-size: 3rem; animation: pulse 1.6s infinite; }
		h1 { margin: .4rem 0 1rem; font-size: clamp(2.2rem, 8vw, 4.5rem); }
		p { margin: 0; font-size: 1.25rem; line-height: 1.6; }
		@keyframes pulse { 50% { transform: scale(1.15); } }
	</style>
</head>
<body>
	<main class="card">
		<div class="heart" aria-hidden="true">♡</div>
		<h1>Welcome, Sneha &amp; Akhil!</h1>
		<p>May your journey together be filled with love, laughter, and countless happy moments.</p>
	</main>
</body>
</html>
